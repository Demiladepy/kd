services:
  - type: web
    name: kudidesk
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MCP_BEARER_TOKEN
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TREASURY_PRIVATE_KEY
        sync: false
      - key: DB_PATH
        value: ./kudidesk.db
      # Chain config — no secrets, safe to keep here. Override in the dashboard
      # to switch testnets without a code change.
      - key: CHAIN_NAME
        value: arc-testnet
      - key: CHAIN_ID
        value: "5042002"
      - key: RPC_URL
        value: https://rpc.testnet.arc.network
      - key: USDC_ADDRESS
        value: "0x3600000000000000000000000000000000000000"
      - key: EXPLORER_TX_URL
        value: https://testnet.arcscan.app/tx/
      - key: GAS_TOKEN_IS_USDC
        value: "true"
